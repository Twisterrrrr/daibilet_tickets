name: DB Backup

on:
  schedule:
    - cron: '0 3 * * *' # ежедневно в 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    name: Backup prod DB on server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH config
        run: |
          PROD_HOST_CLEAN=$(printf '%s' "${{ secrets.PROD_HOST }}" | tr -d '\r\n' | xargs)
          PROD_USER_CLEAN=$(printf '%s' "${{ secrets.PROD_USER }}" | tr -d '\r\n' | xargs)
          if [ -z "${PROD_HOST_CLEAN}" ] || [ -z "${PROD_USER_CLEAN}" ] || [ -z "${{ secrets.PROD_SSH_KEY }}" ]; then
            echo "PROD_HOST, PROD_USER, PROD_SSH_KEY must be set in GitHub secrets"
            exit 1
          fi
          echo "PROD_HOST=${PROD_HOST_CLEAN}" >> $GITHUB_ENV
          echo "PROD_USER=${PROD_USER_CLEAN}" >> $GITHUB_ENV

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${PROD_HOST}" >> ~/.ssh/known_hosts

      - name: Run backup on production server
        run: |
          ssh "${PROD_USER}@${PROD_HOST}" "cd /opt/daibilet && set -a && . deploy/production/.env 2>/dev/null || true && set +a && bash scripts/backup-production-db.sh"
