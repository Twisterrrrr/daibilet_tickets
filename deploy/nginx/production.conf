upstream frontend {
  server daibilet-frontend:3000;
}

upstream backend {
  server daibilet-backend:4000;
}

upstream admin {
  server daibilet-admin:5173;
}

upstream supplier {
  server daibilet-supplier:5174;
}

server {
  listen 80;
  listen [::]:80;
  server_name daibilet.ru www.daibilet.ru api.daibilet.ru admin.daibilet.ru supplier.daibilet.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Основной сайт + API — сертификат для daibilet.ru, www.daibilet.ru
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name daibilet.ru www.daibilet.ru;

  ssl_certificate     /etc/nginx/ssl/main/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/main/privkey.pem;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

