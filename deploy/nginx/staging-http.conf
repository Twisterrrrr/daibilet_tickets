# HTTP-only config for first boot (before SSL certs).
# Use staging.conf after running certbot.
# resolver — переразрешение DNS при каждом запросе (актуальный IP после перезапуска контейнеров).
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $staging_upstream {
  api-staging.daibilet.ru daibilet-staging-backend:4000;
  admin-staging.daibilet.ru daibilet-staging-admin:5173;
  default daibilet-staging-frontend:3000;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name staging.daibilet.ru api-staging.daibilet.ru admin-staging.daibilet.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    set $api_backend daibilet-staging-backend:4000;
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://$staging_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
