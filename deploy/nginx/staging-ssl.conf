# Второй конфиг: HTTPS для staging.daibilet.ru (Let's Encrypt).
# Сертификаты: /etc/letsencrypt/live/staging.daibilet.ru/
# resolver — в default.conf (staging.conf), нужен для proxy_pass с переменными

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api-staging.daibilet.ru;

  ssl_certificate     /etc/letsencrypt/live/staging.daibilet.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.daibilet.ru/privkey.pem;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript;

  client_max_body_size 10m;

  location / {
    set $staging_backend daibilet-staging-backend:4000;
    proxy_pass http://$staging_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    limit_except GET HEAD POST PUT PATCH DELETE OPTIONS {
      allow all;
    }
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name staging.daibilet.ru;

  ssl_certificate     /etc/letsencrypt/live/staging.daibilet.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.daibilet.ru/privkey.pem;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript;

  client_max_body_size 10m;

  location /api/ {
    set $staging_backend daibilet-staging-backend:4000;
    proxy_pass http://$staging_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
