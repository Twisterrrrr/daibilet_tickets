server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin-staging.daibilet.ru;

  ssl_certificate     /etc/letsencrypt/live/staging.daibilet.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.daibilet.ru/privkey.pem;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript;

  client_max_body_size 10m;

  # Прокси API-запросов с админки на backend (так же, как на staging.daibilet.ru)
  location /api/ {
    set $staging_backend daibilet-staging-backend:4000;
    proxy_pass http://$staging_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    limit_except GET HEAD POST PUT PATCH DELETE OPTIONS {
      allow all;
    }
  }

  location / {
    set $staging_admin daibilet-staging-admin:5173;
    proxy_pass http://$staging_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Разрешаем preflight-запросы из браузера (OPTIONS), чтобы админка не падала с 405.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
      add_header Access-Control-Allow-Headers "*";
      add_header Access-Control-Max-Age 1728000;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
  }
}
