# Первый конфиг: HTTP (80) — ACME challenge + редирект на HTTPS.
# Второй конфиг: deploy/nginx/staging-ssl.conf — HTTPS (443).
# Docker DNS — резолв upstream в runtime.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  listen [::]:80;
  server_name staging.daibilet.ru api-staging.daibilet.ru admin-staging.daibilet.ru;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
