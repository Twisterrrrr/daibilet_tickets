# Override: HTTP редирект (staging.conf) + HTTPS (staging-ssl.conf).
# Запуск после certbot: docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d

services:
  nginx:
    volumes:
      - ../nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/staging-ssl.conf:/etc/nginx/conf.d/staging-ssl.conf:ro
      - ../nginx/certbot/conf:/etc/letsencrypt:ro
      - ../nginx/certbot/www:/var/www/certbot
